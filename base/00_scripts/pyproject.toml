[project]
name = "dados-artigos-perinatais-clima"
version = "0.1.0"
description = "Base de dados para os artigos DLNM perinatal x clima nas regioes metropolitanas (SINASC, SIM, BR-DWGD, IBGE)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.20",
    "pyarrow>=16",
    "datasus-dbc>=0.1",
    "dbfread>=2.0.7",
    "openpyxl>=3.1",
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "shapely>=2.0",
    "pyproj>=3.6",
    "xarray>=2024.6",
    "netCDF4>=1.7",
    "dask>=2024.6",
    "gdown>=6.0",
    "cdsapi",
    "access-parser",
    "tabulate>=0.9",
]

[tool.uv]
package = false
